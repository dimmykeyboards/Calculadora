<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Científica Tech</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0c10;
            --calc-bg: rgba(18, 24, 38, 0.85);
            --border-color: #00f0ff;
            --btn-bg: rgba(255, 255, 255, 0.03);
            --btn-hover: rgba(0, 240, 255, 0.15);
            --text-main: #e2f1f7;
            --accent-cyan: #00f0ff;
            --accent-pink: #ff007f;
            --accent-orange: #ff9900;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(0, 240, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(ff, 0, 127, 0.08) 0%, transparent 40%);
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* Estrutura da Calculadora */
        .calculadora {
            background: var(--calc-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 440px;
            box-shadow: 
                0 0 30px rgba(0, 240, 255, 0.15),
                inset 0 0 15px rgba(0, 240, 255, 0.05);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .brand {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            letter-spacing: 3px;
            color: var(--accent-cyan);
            text-shadow: 0 0 8px var(--accent-cyan);
        }

        .mode-indicator {
            font-size: 11px;
            color: var(--accent-pink);
            letter-spacing: 1px;
            font-weight: bold;
        }

        /* Visor Digital */
        .visor {
            background: rgba(4, 8, 15, 0.9);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: right;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
        }

        .historico {
            font-family: 'Orbitron', monospace;
            font-size: 14px;
            color: rgba(226, 241, 247, 0.5);
            min-height: 20px;
            overflow-x: auto;
            white-space: nowrap;
        }

        .display {
            font-family: 'Orbitron', monospace;
            font-size: 28px;
            color: var(--accent-cyan);
            min-height: 40px;
            overflow-x: auto;
            white-space: nowrap;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
            margin-top: 5px;
        }

        /* Teclado Grid */
        .teclado {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        /* Botões */
        button {
            background: var(--btn-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            font-weight: 700;
            padding: 14px 0;
            cursor: pointer;
            transition: all 0.15s ease;
            outline: none;
        }

        button:hover {
            background: var(--btn-hover);
            border-color: var(--accent-cyan);
            color: #fff;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(1px);
            box-shadow: none;
        }

        /* Estilos especiais de botões */
        .btn-func {
            color: var(--accent-cyan);
            background: rgba(0, 240, 255, 0.05);
        }

        .btn-op {
            color: var(--accent-pink);
            background: rgba(ff, 0, 127, 0.05);
            border-color: rgba(ff, 0, 127, 0.2);
        }

        .btn-op:hover {
            border-color: var(--accent-pink);
            box-shadow: 0 0 12px rgba(255, 0, 127, 0.4);
            background: rgba(255, 0, 127, 0.2);
        }

        .btn-clear {
            color: var(--accent-orange);
            background: rgba(255, 153, 0, 0.08);
            border-color: rgba(255, 153, 0, 0.3);
        }

        .btn-clear:hover {
            border-color: var(--accent-orange);
            box-shadow: 0 0 12px rgba(255, 153, 0, 0.4);
            background: rgba(255, 153, 0, 0.2);
        }

        .btn-equal {
            grid-column: span 2;
            background: linear-gradient(135deg, var(--accent-cyan), #0088ff);
            color: #000;
            font-weight: bold;
            font-size: 20px;
            border: none;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
        }

        .btn-equal:hover {
            background: linear-gradient(135deg, #33f3ff, #1a94ff);
            color: #000;
            box-shadow: 0 0 22px rgba(0, 240, 255, 0.8);
        }
    </style>
</head>
<body>

    <div class="calculadora">
        <div class="header">
            <span class="brand">CALCULADORA DE TATIANA VIANNA</span>
            <span class="mode-indicator" id="modoDegRad">DEG</span>
        </div>

        <!-- Visor -->
        <div class="visor">
            <div id="historico" class="historico"></div>
            <div id="display" class="display">0</div>
        </div>

        <!-- Teclado de Funções Avançadas e Números -->
        <div class="teclado">
            <!-- Linha 1 -->
            <button class="btn-func" onclick="alternarDegRad()">RAD/DEG</button>
            <button class="btn-func" onclick="inserir('sin(')">sin</button>
            <button class="btn-func" onclick="inserir('cos(')">cos</button>
            <button class="btn-func" onclick="inserir('tan(')">tan</button>
            <button class="btn-clear" onclick="limparTudo()">AC</button>

            <!-- Linha 2 -->
            <button class="btn-func" onclick="inserir('log(')">log</button>
            <button class="btn-func" onclick="inserir('ln(')">ln</button>
            <button class="btn-func" onclick="inserir('^')">x^y</button>
            <button class="btn-func" onclick="inserir('√(')">√</button>
            <button class="btn-clear" onclick="deletar()">DEL</button>

            <!-- Linha 3 -->
            <button class="btn-func" onclick="inserir('π')">π</button>
            <button class="btn-func" onclick="inserir('e')">e</button>
            <button class="btn-func" onclick="inserir('!')">x!</button>
            <button class="btn-func" onclick="inserir('(')">(</button>
            <button class="btn-func" onclick="inserir(')')">)</button>

            <!-- Linha 4 (Teclado Numérico + Operações) -->
            <button onclick="inserir('7')">7</button>
            <button onclick="inserir('8')">8</button>
            <button onclick="inserir('9')">9</button>
            <button class="btn-op" onclick="inserir('÷')">÷</button>
            <button class="btn-op" onclick="inserir('%')">%</button>

            <!-- Linha 5 -->
            <button onclick="inserir('4')">4</button>
            <button onclick="inserir('5')">5</button>
            <button onclick="inserir('6')">6</button>
            <button class="btn-op" onclick="inserir('×')">×</button>
            <button class="btn-func" onclick="inserir('1/')">1/x</button>

            <!-- Linha 6 -->
            <button onclick="inserir('1')">1</button>
            <button onclick="inserir('2')">2</button>
            <button onclick="inserir('3')">3</button>
            <button class="btn-op" onclick="inserir('-')">-</button>
            <button class="btn-func" onclick="inverterSinal()">±</button>

            <!-- Linha 7 -->
            <button onclick="inserir('0')">0</button>
            <button onclick="inserir('.')">.</button>
            <button class="btn-op" onclick="inserir('+')">+</button>
            <button class="btn-equal" onclick="calcular()">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        const historico = document.getElementById('historico');
        const modoDegRadElemento = document.getElementById('modoDegRad');
        
        let expressao = '';
        let emRadianos = false;

        function atualizarVisor() {
            display.innerText = expressao === '' ? '0' : expressao;
        }

        function inserir(valor) {
            if (display.innerText === 'Erro') expressao = '';
            expressao += valor;
            atualizarVisor();
        }

        function limparTudo() {
            expressao = '';
            historico.innerText = '';
            atualizarVisor();
        }

        function deletar() {
            expressao = expressao.slice(0, -1);
            atualizarVisor();
        }

        function alternarDegRad() {
            emRadianos = !emRadianos;
            modoDegRadElemento.innerText = emRadianos ? 'RAD' : 'DEG';
        }

        function inverterSinal() {
            if (expressao === '') return;
            if (expressao.startsWith('-')) {
                expressao = expressao.slice(1);
            } else {
                expressao = '-' + expressao;
            }
            atualizarVisor();
        }

        // Função de cálculo do Fatorial (!)
        function fatorial(n) {
            if (n < 0) return NaN;
            if (n === 0 || n === 1) return 1;
            let res = 1;
            for (let i = 2; i <= n; i++) res *= i;
            return res;
        }

        function calcular() {
            if (expressao === '') return;

            try {
                let parsedExp = expressao;
                historico.innerText = expressao + ' =';

                // Substituições de símbolos e constantes
                parsedExp = parsedExp.replace(/÷/g, '/');
                parsedExp = parsedExp.replace(/×/g, '*');
                parsedExp = parsedExp.replace(/π/g, 'Math.PI');
                parsedExp = parsedExp.replace(/\be\b/g, 'Math.E');
                parsedExp = parsedExp.replace(/\^/g, '**');
                parsedExp = parsedExp.replace(/√\(/g, 'Math.sqrt(');
                parsedExp = parsedExp.replace(/log\(/g, 'Math.log10(');
                parsedExp = parsedExp.replace(/ln\(/g, 'Math.log(');

                // Tratamento de Trigonometria (Graus vs Radianos)
                const toRad = emRadianos ? '' : '* (Math.PI / 180)';
                parsedExp = parsedExp.replace(/sin\(([^)]+)\)/g, `Math.sin(($1) ${toRad})`);
                parsedExp = parsedExp.replace(/cos\(([^)]+)\)/g, `Math.cos(($1) ${toRad})`);
                parsedExp = parsedExp.replace(/tan\(([^)]+)\)/g, `Math.tan(($1) ${toRad})`);

                // Tratamento de Fatorial (ex: 5!)
                parsedExp = parsedExp.replace(/(\d+)!/g, (match, p1) => fatorial(parseInt(p1)));

                // Tratamento de Inverso (1/x)
                parsedExp = parsedExp.replace(/1\/([0-9.]+)/g, '(1/$1)');

                // Avaliação da expressão matemática
                let resultado = eval(parsedExp);

                // Arredondamento para evitar imprecisões de ponto flutuante (ex: 0.0000000000000002)
                if (typeof resultado === 'number') {
                    resultado = parseFloat(resultado.toFixed(10));
                }

                expressao = resultado.toString();
                atualizarVisor();

            } catch (error) {
                display.innerText = 'Erro';
                expressao = '';
            }
        }
    </script>
</body>
</html>
